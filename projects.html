<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Projects — [Your Name]</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="wash-projects" data-page="projects">

<div class="album">
  <div id="nav-placeholder"></div>

  <div class="page-content">
    <main>
      <section style="padding-bottom:8px;">
        <div class="wrap">
          <p class="eyebrow">No.02</p>
          <h1 class="page-title">Choose a destination.</h1>
          <p class="max-w lede">
            Six stops, each one a problem I got to dig into. Tap a stamp to open the full entry — the challenge,
            what I did, and how it turned out.
          </p>
        </div>
      </section>

      <section class="pt-0">
        <div class="wrap">
          <span class="album-note" style="margin-bottom:18px;">
            <span class="washi-tape" aria-hidden="true" style="width:80px; left:-8px; transform:rotate(4deg); --accent:var(--sage);"></span>
            <span class="hand-note" style="display:inline-block;">tap any stamp →</span>
          </span>
          <div class="stamp-collection" id="stamp-grid" data-filter="all"></div>
        </div>
      </section>
    </main>

    <div id="footer-placeholder"></div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
